    <script>
      // Ignore HMR WebSocket connection warnings in AI Studio iframe environment
      window.addEventListener('error', function(e) {
        if (
          (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('createWebSocket') !== -1)) ||
          (e.filename && e.filename.indexOf('@vite/client') !== -1)
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason && (e.reason.message || String(e.reason));
        if (reason && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('createWebSocket') !== -1)) {
          e.preventDefault();
        }
      });
    </script>
